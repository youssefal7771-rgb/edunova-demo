<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الامتحانات السابقة - منصة مستر سيد العربي</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #ebf1fa; color: #333; min-height: 100vh; padding-bottom: 50px; }
        
        /* خلفية المنصة */
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.1; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80"><text y="25" x="10" font-family="FontAwesome" font-size="12" fill="%232b7a78">⚛</text><text y="30" x="60" font-family="FontAwesome" font-size="10" fill="%23fe9c38">🧪</text></svg>'); background-repeat: repeat; animation: bgMove 20s linear infinite; }
        @keyframes bgMove { 0% { background-position: 0 0; } 100% { background-position: 80px 80px; } }

        /* الشريط العلوي */
        .navbar { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); height: 70px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border-bottom: 1px solid #eef0f3; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; }
        .navbar .logo { font-size: 1.3rem; font-weight: 800; color: #1f3c6d; }
        .btn-back-nav { background: #f1f4f9; color: #1f3c6d; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-back-nav:hover { background: #e2e8f0; }

        /* حاوية المحتوى */
        .main-container { margin-top: 100px; padding: 0 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
        
        .page-header { text-align: center; margin-bottom: 40px; }
        .page-header h2 { font-size: 1.8rem; color: #1a2536; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .page-header h2 i { color: #2b7a78; }
        .page-header p { color: #64748b; font-size: 1rem; }

        /* حالة لو الامتحانات السابقة فارغة */
        .empty-state { text-align: center; padding: 60px 20px; background: #fff; border-radius: 12px; border: 2px dashed #cbd5e1; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .empty-state i { font-size: 4rem; color: #cbd5e1; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        
        .empty-state h3 { color: #1a2536; font-size: 1.3rem; margin-bottom: 10px; }
        .empty-state p { color: #64748b; font-weight: 500; font-size: 1rem; line-height: 1.6; max-width: 500px; margin: 0 auto; }

        /* 🛡️ درع الحماية */
        body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <div class="logo">Mr.Sayed Araby</div>
        <a href="dashboard.html" class="btn-back-nav"><i class="fa-solid fa-arrow-left"></i> رجوع</a>
    </header>

    <!-- المحتوى -->
    <main class="main-container">
        <div class="page-header">
            <h2><i class="fa-solid fa-file-circle-question"></i> الامتحانات السابقة</h2>
            <p>تصفح وحل الامتحانات والتدريبات التي تم طرحها مسبقاً.</p>
        </div>

        <!-- رسالة عدم وجود امتحانات حالياً -->
        <div class="empty-state">
            <i class="fa-solid fa-file-lines"></i>
            <h3>لا توجد امتحانات سابقة متاحة</h3>
            <p>لم يتم رفع أي امتحانات سابقة للمرحلة الخاصة بك حتى الآن. ستظهر هنا الامتحانات والتدريبات السابقة فور انتهائها ومراجعتها.</p>
        </div>
    </main>

    <!-- 🛡️ سكريبت الحماية -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault(); return false;
            }
        });
    </script>
</body>
</html>
