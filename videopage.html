<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة المحاضرة - منصة سيد العربي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f3f5f9;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        .video-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .top-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: white;
            padding: 18px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            border: 1px solid #eaedf3;
        }

        .top-nav-bar h2 {
            font-size: 1.2rem;
            color: #655ecc;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-return {
            background: #655ecc;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-return:hover { background: #5149b5; }

        .main-player-box {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #eaedf3;
            box-shadow: 0 4px 25px rgba(0,0,0,0.02);
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 20px;
        }

        .main-player-box iframe, .main-player-box video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
            background: #000;
        }

        /* 🚀 زرار الإنقاذ الموف لحل مشكلة حظر التضمين نهائياً */
        .fallback-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .btn-youtube-fallback {
            background-color: #655ecc;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(101, 94, 204, 0.3);
            transition: 0.3s ease;
            animation: pulse 2s infinite;
        }
        .btn-youtube-fallback:hover {
            background-color: #5149b5;
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .video-footer-tip {
            margin-top: 20px;
            text-align: center;
            color: #a0a7b5;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="video-container">
        
        <div class="top-nav-bar">
            <h2 id="lessonVideoTitle"><i class="fa-solid fa-circle-play"></i> جاري تحميل عنوان الدرس...</h2>
            <a href="lectures.html" class="btn-return">عودة للمحاضرات <i class="fa-solid fa-arrow-left"></i></a>
        </div>

        <div class="main-player-box" id="playerContainer">
            </div>

        <div class="fallback-container" id="fallbackZone"></div>

        <div class="video-footer-tip">
            <i class="fa-solid fa-shield-halved"></i> مشغل آمن ومحمي - منصة سيد العربي التعليمية
        </div>

    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        window.onload = function() {
            const rawUrl = getQueryParam('video');
            const videoTitle = getQueryParam('title');

            const playerContainer = document.getElementById('playerContainer');
            const fallbackZone = document.getElementById('fallbackZone');
            const titleHeader = document.getElementById('lessonVideoTitle');

            if (rawUrl) {
                const videoUrl = decodeURIComponent(rawUrl);
                let videoId = "";
                
                if (videoUrl.includes("youtu.be/")) {
                    videoId = videoUrl.split("youtu.be/")[1].split("?")[0].split("&")[0];
                } else if (videoUrl.includes("v=")) {
                    videoId = videoUrl.split("v=")[1].split("&")[0];
                } else if (videoUrl.includes("embed/")) {
                    videoId = videoUrl.split("embed/")[1].split("?")[0].split("&")[0];
                } else if (videoUrl.includes("youtube.com/shorts/")) {
                    videoId = videoUrl.split("shorts/")[1].split("?")[0].split("&")[0];
                }

                if (videoId) {
                    // تشغيل الإمبيد العادي
                    playerContainer.innerHTML = `
                        <iframe 
                            src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    `;
                    
                    // إظهار زرار الدخول المباشر احتياطياً لحل مشكلة قيود التضمين للأبد وبنفس اللون
                    fallbackZone.innerHTML = `
                        <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" class="btn-youtube-fallback">
                            <i class="fa-brands fa-youtube"></i> إذا لم يشتغل المشغل، اضغط هنا للمشاهدة مباشرة
                        </a>
                    `;
                } else {
                    playerContainer.innerHTML = `
                        <video controls autoplay controlsList="nodownload">
                            <source src="${videoUrl}" type="video/mp4">
                            عذراً، متصفحك لا يدعم تشغيل هذا الفيديو.
                        </video>
                    `;
                }
            } else {
                playerContainer.innerHTML = `<div style="position: absolute; width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#333; font-weight:bold;">تنبيه: لم يتم العثور على رابط فيديو صالح.</div>`;
            }

            if (videoTitle) {
                titleHeader.innerHTML = `<i class="fa-solid fa-circle-play"></i> عرض شرح: ${decodeURIComponent(videoTitle)}`;
                document.title = `مشاهدة ${decodeURIComponent(videoTitle)} - منصة سيد العربي`;
            }
        };
    </script>
</body>
</html>
